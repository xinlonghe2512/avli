name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env: 
  PYTHON_VERSION: "3.13"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: 
          enable-cache: true
          cache-dependency-glob: | 
            uv.lock
            apps/*/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --all-packages

      - name: Check lockfile
        run: uv lock --check
      
      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run lint
        run: uv run ruff check .

      - name: Run type check
        run: uv run ty check

      - name: Run tests
        run: uv run pytest -v
      


  vulnerability:
    name: Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: 
          enable-cache: true
          cache-dependency-glob: | 
            uv.lock
            apps/*/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --all-packages

      - name: Audit dependencies
        run: uv run pip-audit
