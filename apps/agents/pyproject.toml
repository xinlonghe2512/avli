[project]
name = "avli-agents"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Xin Long He", email = "xinlonghe2512@gmail.com" }]

dependencies = [
  "aiocache>=0.12.3",
  "alembic>=1.19.2",
  "asgi-correlation-id>=5.0.1",
  "asgiref>=3.12.1",
  "bcrypt>=5.0.0",
  "celery[redis]>=5.3.1",
  "docling>=2.126.0",
  "fastapi[standard]>=0.141.1,<1.0.0",
  "langchain-community>=0.4.2",
  "langchain-ollama>=1.1.0",
  "langchain-openrouter>=0.2.8",
  "langfuse>=4.14.4",
  "langgraph>=1.2.11",
  "langgraph-checkpoint>=4.2.0",
  "langgraph-checkpoint-postgres>=3.1.2",
  "llama-cpp-python>=0.3.35",
  "llama-index-core>=0.14.24",
  "llama-index-embeddings-huggingface>=0.8.0",
  "llama-index-llms-openrouter>=0.6.0",
  "llama-index-readers-docling>=0.5.0",
  "llama-index-vector-stores-qdrant>=0.10.3",
  "mem0ai>=2.0.20",
  "prometheus-client>=0.26.0",
  "prometheus-fastapi-instrumentator>=8.1.0",
  "psycopg2-binary>=2.9.12",
  "psycopg[binary]>=3.3.5",
  "pydantic-settings<3.0.0,>=2.2.1",
  "pyinstrument>=5.1.3",
  "python-dotenv>=1.2.3",
  "python-jose[cryptography]>=3.5.0",
  "python-multipart>=0.0.32",
  "sentence-transformers>=6.0.0",
  "sqlmodel>=0.0.42",
  "structlog>=26.1.0",
  "tenacity<10.0.0,>=8.2.3",
]

[dependency-groups]
dev = [
  "coverage<8.0.0,>=7.4.3",
  "deepeval>=4.1.10",
  "detect-secrets>=1.5.0",
  "pyinstrument>=5.1.3",
  "pytest<10.0.0,>=7.4.3",
  "ragas>=0.4.3",
  "ruff<1.0.0,>=0.2.2",
  "ty>=0.0.74",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true

[tool.fastapi]
entrypoint = "app.main:app"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = []
fix = true

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "ARG001",  # unused arguments in functions
  "T201",  # print statements are not allowed
]
ignore = [
  "E501",  # line too long, handled by black
  "B008",  # do not perform function calls in argument defaults
  "W191",  # indentation contains tabs
  "B904",  # Allow raising exceptions without from e, for HTTPException
]
extend-select = [
  "ANN",
  "PYI",
]
preview = true

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.ty.terminal]
error-on-warning = true
