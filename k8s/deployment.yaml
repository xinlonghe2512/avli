apiVersion: apps/v1
kind: Deployment
metadata:
  name: avli
  namespace: avli-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: avli
  template:
    metadata:
      labels:
        app: avli
    spec:
      containers:
        - name: avli
          image: avli-asset-intel-service-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: DB_HOST
              value: "avli-db"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "avli_db"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: avli-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: avli-db-secret
                  key: password
