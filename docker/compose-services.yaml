services:
  asset-intel-service:
    container_name: asset-intel-service
    build:
      context: .
      dockerfile: ../services/asset-intel-service/Dockerfile
      args:
        AIS_ENV: ${AIS_ENV:-development}
    restart: unless-stopped
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
    ports:
      - ${AIS_PORT?Variable not set}:8000
    environment:
      - AIS_ENV=${AIS_ENV:-development}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set to a strong random value}
      - DATABASE_HOST=${DATABASE_HOST?Variable not set}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8000/api/v1/utils/health-check/",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - .env
    networks:
      - avli-services-network

  celery:
    container_name: celery
    build:
      context: .
      dockerfile: ../celery.Dockerfile
    restart: unless-stopped
    volumes:
      - .:/workspace:cached
    depends_on:
      - valkey
    env_file:
      - .env
    networks:
      - avli-services-network

  postgres:
    container_name: postgres
    image: docker.io/pgvector/pgvector:pg18-trixie
    restart: unless-stopped
    ports:
      - ${DATABASE_PORT?Variable not set}:5432
    environment:
      - POSTGRES_DB=${DATABASE_DB_NAME?Variable not set}
      - POSTGRES_USER=${DATABASE_DB_USER?Variable not set}
      - POSTGRES_PASSWORD=${DATABASE_DB_PASSWORD?Variable not set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE_DB_USER?Variable not set} -d ${DATABASE_DB_NAME?Variable not set}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - .env
    networks:
      - avli-services-network

  valkey:
    container_name: valkey
    image: docker.io/valkey/valkey:8.1.6-alpine
    restart: always
    ports:
      - ${CACHE_PORT?Variable not set}:6379
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      retries: 5
      timeout: 10s
      start_period: 5s
    env_file:
      - .env
    networks:
      - avli-services-network

  qdrant:
    image: docker.io/qdrant/qdrant:v1.19.1-unprivileged
    container_name: qdrant
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - ${KNOWLEDGE_BASE_PORT?Variable not set}:6333
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:6333"]
      interval: 30s
      retries: 3
      timeout: 10s
      start_period: 5s
    env_file:
      - .env
    networks:
      - avli-services-network

configs:
  qdrant_config:
    content: |
      log_level: INFO

volumes:
  valkey-data:
    driver: local
  postgres-data:
    driver: local
  qdrant-data:
    driver: local

networks:
  avli-services-network:
    driver: bridge
