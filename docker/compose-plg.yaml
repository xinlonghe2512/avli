services:
  prometheus:
    image: docker.io/prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - ${PROMETHEUS_PORT?Variable not set}:9091
    volumes:
      - ./docker/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml
    networks:
      - plg-network
    env_file:
      - .env

  grafana:
    image: docker.io/grafana/grafana:13.0.8-slim
    container_name: grafana
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - ${GRAFANA_PORT?Variable not set}:3000
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_SECURITY_ADMIN_PASSWORD}
    networks:
      - plg-network
    env_file:
      - .env
    depends_on:
      - prometheus

  loki:
    image: docker.io/grafana/loki:3.7.7
    container_name: loki
    restart: unless-stopped
    ports:
      - ${LOKI_PORT?Variable not set}:3100
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - plg-network
    env_file:
      - .env

  promtail:
    image: docker.io/grafana/promtail:3.6.11
    container_name: promtail
    restart: unless-stopped
    volumes:
      - /var/log:/var/log
      - /etc/machine-id:/etc/machine-id
      - ./docker/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/promtail-config.yaml
    networks:
      - plg-network
    env_file:
      - .env
    depends_on:
      - loki

volumes:
  grafana_data:

networks:
  plg-network:
    driver: bridge
