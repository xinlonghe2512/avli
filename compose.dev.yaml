services:
  agents:
    build:
      context: .
      dockerfile: ./apps/agents/Dockerfile
    restart: always
    volumes:
      - .:/workspace:cached
    ports:
      - "8000:8000"
    networks:
      - avli-network
    env_file:
      - .env.dev
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - AGENTS_CORS_ORIGINS=${AGENTS_CORS_ORIGINS:-*}
      - SECRET_KEY=${SECRET_KEY:-local-dev-secret-key}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5

  ingestor:
    build:
      context: .
      dockerfile: ./apps/ingestor/Dockerfile
    restart: always
    volumes:
      - .:/workspace:cached
    ports:
      - "9000:9000"
    networks:
      - avli-network
    env_file:
      - .env.dev
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - INGESTOR_CORS_ORIGINS=${INGESTOR_CORS_ORIGINS:-*}
      - SECRET_KEY=${SECRET_KEY:-local-dev-secret-key}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: docker.io/qdrant/qdrant:v1.19.0-unprivileged
    container_name: qdrant-vector-db
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "6333:6333"
    networks:
      - avli-network
    env_file:
      - .env.dev
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:6333/healthz"]
      interval: 30s
      retries: 3
      timeout: 10s
      start_period: 5s

  redis:
    image: docker.io/redis:8.8.2-alpine3.23
    container_name: redis-db
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - avli-network
    env_file:
      - .env.dev
    environment:
      - REDIS_ARGS="--appendonly yes"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      retries: 3
      timeout: 10s
      start_period: 5s

configs:
  qdrant_config:
    content: |
      log_level: INFO

volumes:
  qdrant_storage:
    driver: local
  redis_data:
    driver: local

networks:
  avli-network:
    driver: bridge
